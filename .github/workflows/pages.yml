name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html "$RUNNER_TEMP/site/"
          cp -R assets "$RUNNER_TEMP/site/assets"
          cp CNAME "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
